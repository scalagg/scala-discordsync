plugins {
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.7.20"
    id "org.jetbrains.kotlin.kapt" version "1.7.20"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.minequest.sync"
version "1.0.0"

repositories {
    mavenCentral()

    maven {
        url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/central" }
    maven { url "https://repo.viaversion.com/" }

    maven {
        name "Scala"
        url "${property("artifactory_contextUrl")}/gradle-release"

        credentials {
            username property("artifactory_user")
            password property("artifactory_password")
        }
    }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"

    compileOnly "gg.scala.basics.plugin:scala-basics-plugin:1.0.2"

    compileOnly "gg.scala.commons:bukkit:3.0.5"
    kapt "gg.scala.commons:bukkit:3.0.5"

    compileOnly "gg.scala.store:spigot:0.1.3"
    compileOnly "gg.scala.spigot:server:1.1.0"

    compileOnly "gg.scala.cloudsync:spigot:1.0.1"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "quest-discord-sync.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "$minequest_artifactory_contextUrl/$minequest_artifactory_release"

            credentials {
                username property("minequest_artifactory_user")
                password property("minequest_artifactory_password")
            }
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
